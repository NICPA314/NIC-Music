name: NICMusic
options:
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.2.1'
    CURRENT_PROJECT_VERSION: '3'
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  NICMusic:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: LyricsWeb/dist
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nicpa.amllplayer.test
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: NIC Music
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIBackgroundModes: audio
    info:
      path: Info.plist
      properties:
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
  NICMusicTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes: [Fixtures, make_fixtures.py]
      - path: Tests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: NICMusic
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  NICMusicUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: NICMusic
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NICMusic:
    build:
      targets:
        NICMusic: all
        NICMusicTests: [test]
        NICMusicUITests: [test]
    test:
      targets: [NICMusicTests, NICMusicUITests]
