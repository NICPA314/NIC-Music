name: Native iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [native-ios]
    paths: ['native-ios/**', '.github/workflows/native-ios.yml']
permissions:
  contents: read
concurrency:
  group: nic-music-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    permissions:
      contents: write
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: native-ios/LyricsWeb/package-lock.json
      - name: Build offline AMLL lyrics
        working-directory: native-ios/LyricsWeb
        run: npm ci --ignore-scripts && npm run build
      - name: Generate native project
        working-directory: native-ios
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen generate
      - name: Build device and simulator
        working-directory: native-ios
        run: |
          set -euo pipefail
          xcodebuild build -project NICMusic.xcodeproj -scheme NICMusic -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO NIC_DIAGNOSTIC_LOGGING=YES > build-device.log 2>&1 || { tail -100 build-device.log; exit 1; }
          xcodebuild build -project NICMusic.xcodeproj -scheme NICMusic -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO NIC_DIAGNOSTIC_LOGGING=YES > build-simulator.log 2>&1 || { tail -100 build-simulator.log; exit 1; }
          xcodebuild build -project NICMusic.xcodeproj -scheme NICImportFixtures -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath build/fixtures CODE_SIGNING_ALLOWED=NO > build-fixtures.log 2>&1 || { tail -100 build-fixtures.log; exit 1; }
      - name: Package
        id: package
        working-directory: native-ios
        run: |
          set -euo pipefail
          mkdir -p build/package/Payload
          ditto build/device/Build/Products/Release-iphoneos/NICMusic.app build/package/Payload/NICMusic.app
          test -f build/package/Payload/NICMusic.app/dist/index.html
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' build/package/Payload/NICMusic.app/Info.plist)
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' build/package/Payload/NICMusic.app/Info.plist)
          IPA_NAME="NIC-Music-${VERSION}-build${BUILD}.ipa"
          echo "ipa_name=$IPA_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          cd build/package
          zip -qry "$IPA_NAME" Payload
          unzip -t "$IPA_NAME"
          shasum -a 256 "$IPA_NAME" > SHA256.txt
      - name: Simulator launch proof
        timeout-minutes: 15
        working-directory: native-ios
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys,re; d=json.load(sys.stdin)["devices"]; keys=sorted((k for k in d if "iOS" in k),key=lambda k:tuple(map(int,re.findall(r"\d+",k))),reverse=True); phones=[x for k in keys for x in d[k] if "iPhone" in x["name"]]; print(next((x["udid"] for x in phones if x["name"] in ["iPhone 17 Pro", "iPhone 18 Pro", "iPhone 17"]),phones[0]["udid"]))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b | tee build-simulator-launch.log
          xcrun simctl install "$DEVICE" build/simulator/Build/Products/Debug-iphonesimulator/NICMusic.app
          xcrun simctl install "$DEVICE" build/fixtures/Build/Products/Debug-iphonesimulator/NICImportFixtures.app
          xcrun simctl launch "$DEVICE" app.nicpa.importfixtures
          FIXTURE_DATA=$(xcrun simctl get_app_container "$DEVICE" app.nicpa.importfixtures data)
          mkdir -p "$FIXTURE_DATA/Documents/Import Samples"
          cp Tests/Fixtures/*.m4a "$FIXTURE_DATA/Documents/Import Samples/"
          xcrun simctl launch "$DEVICE" app.nicpa.amllplayer.test
          sleep 5
          xcrun simctl io "$DEVICE" screenshot build/library-light.png
          xcrun simctl ui "$DEVICE" appearance dark
          sleep 2
          xcrun simctl io "$DEVICE" screenshot build/library-dark.png
      - name: Verify import, metadata, album grouping, independent copies and playback
        id: verify
        timeout-minutes: 20
        working-directory: native-ios
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices booted -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for v in d["devices"].values() for x in v if x["state"] == "Booted"))')
          xcrun simctl ui "$DEVICE" appearance light
          xcodebuild test -project NICMusic.xcodeproj -scheme NICMusic -configuration Release -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO -derivedDataPath build/simulator -resultBundlePath build/ImportTests.xcresult CODE_SIGNING_ALLOWED=NO NIC_DIAGNOSTIC_LOGGING=YES ENABLE_TESTABILITY=YES > build-tests.log 2>&1 || { tail -150 build-tests.log; exit 1; }
          APP_DATA=$(xcrun simctl get_app_container "$DEVICE" app.nicpa.amllplayer.test data)
          grep -q 'picker presented by UIKit, delegate retained=true' "$APP_DATA/Documents/Logs/NIC-Music.log"
          grep -q 'AMLL background ready' "$APP_DATA/Documents/Logs/NIC-Music.log"
          xcrun simctl launch "$DEVICE" app.nicpa.amllplayer.test
          sleep 3
          xcrun simctl io "$DEVICE" screenshot build/library-imported.png
      - name: Export test screenshots
        if: always()
        working-directory: native-ios
        run: |
          if [ -d build/ImportTests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/ImportTests.xcresult --output-path build/test-attachments || true
          fi
          DEVICE=$(xcrun simctl list devices booted -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((x["udid"] for v in d["devices"].values() for x in v if x["state"] == "Booted"), ""))')
          if [ -n "$DEVICE" ]; then
            APP_DATA=$(xcrun simctl get_app_container "$DEVICE" app.nicpa.amllplayer.test data)
            cp "$APP_DATA/Documents/Logs/NIC-Music.log" build-import-events.log || true
            xcrun simctl spawn "$DEVICE" log show --last 10m --style compact --predicate 'process == "NICMusic" OR (process == "com.apple.DocumentManagerUICore.DocumentManagerService" AND messageType == error)' > build-import-runtime.log 2>&1 || true
          fi
      - name: Publish direct IPA download
        if: success() && steps.package.outcome == 'success' && steps.verify.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IPA_NAME: ${{ steps.package.outputs.ipa_name }}
          APP_VERSION: ${{ steps.package.outputs.version }}
          APP_BUILD: ${{ steps.package.outputs.build }}
        run: |
          set -euo pipefail
          # A unique tag keeps earlier packages intact, including workflow reruns.
          TAG="ios-${APP_VERSION}-build${APP_BUILD}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          NOTES="$RUNNER_TEMP/nic-music-release.md"
          cat > "$NOTES" <<EOF
          下载附件 **${IPA_NAME}** 即可，无需解压。

          开发测试版，未签名，需自行签名安装。版本：${APP_VERSION} (${APP_BUILD})。
          已通过设备及模拟器构建和自动化测试；测试通过不代表真机导入问题已解决。

          构建记录：https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          源码提交：${GITHUB_SHA}
          EOF
          gh release create "$TAG" \
            "native-ios/build/package/$IPA_NAME" \
            native-ios/build/package/SHA256.txt \
            --target "$GITHUB_SHA" --prerelease \
            --title "NIC Music ${APP_VERSION} (${APP_BUILD}) · 测试版" \
            --notes-file "$NOTES"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${IPA_NAME}"
          # Check the published attachment bytes, not just the upload response.
          VERIFY_DIR="$RUNNER_TEMP/nic-music-release-check"
          mkdir -p "$VERIFY_DIR"
          gh release download "$TAG" --pattern "$IPA_NAME" --dir "$VERIFY_DIR"
          cmp "native-ios/build/package/$IPA_NAME" "$VERIFY_DIR/$IPA_NAME"
          echo "[直接下载 ${IPA_NAME}](${DOWNLOAD_URL})" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Native-simulator-screenshots
          path: native-ios/build/library-*.png
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Native-test-results
          path: |
            native-ios/build/ImportTests.xcresult
            native-ios/build/test-attachments
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Native-build-logs
          path: native-ios/build-*.log
          retention-days: 7
