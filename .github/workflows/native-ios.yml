name: Native iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [native-ios]
    paths: ['native-ios/**', '.github/workflows/native-ios.yml']
permissions:
  contents: read
concurrency:
  group: native-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: native-ios/LyricsWeb/package-lock.json
      - name: Build offline AMLL lyrics
        working-directory: native-ios/LyricsWeb
        run: npm ci --ignore-scripts && npm run build
      - name: Generate native project
        working-directory: native-ios
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen generate
      - name: Build device and simulator
        working-directory: native-ios
        run: |
          set -euo pipefail
          xcodebuild build -project NICMusic.xcodeproj -scheme NICMusic -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO > build-device.log 2>&1 || { tail -100 build-device.log; exit 1; }
          xcodebuild build -project NICMusic.xcodeproj -scheme NICMusic -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO > build-simulator.log 2>&1 || { tail -100 build-simulator.log; exit 1; }
      - name: Package
        working-directory: native-ios
        run: |
          set -euo pipefail
          mkdir -p build/package/Payload
          ditto build/device/Build/Products/Release-iphoneos/NICMusic.app build/package/Payload/NICMusic.app
          test -f build/package/Payload/NICMusic.app/dist/index.html
          cd build/package
          zip -qry NIC-Music-0.2.0-Test-Unsigned.ipa Payload
          unzip -t NIC-Music-0.2.0-Test-Unsigned.ipa
          shasum -a 256 *.ipa > SHA256.txt
      - name: Simulator launch proof
        timeout-minutes: 15
        working-directory: native-ios
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys,re; d=json.load(sys.stdin)["devices"]; keys=sorted((k for k in d if "iOS" in k),key=lambda k:tuple(map(int,re.findall(r"\d+",k))),reverse=True); print(next(x["udid"] for k in keys for x in d[k] if "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b | tee build-simulator-launch.log
          xcrun simctl install "$DEVICE" build/simulator/Build/Products/Debug-iphonesimulator/NICMusic.app
          APP_DATA=$(xcrun simctl get_app_container "$DEVICE" app.nicpa.amllplayer.test data)
          mkdir -p "$APP_DATA/Documents/Import Samples"
          cp Tests/Fixtures/*.m4a "$APP_DATA/Documents/Import Samples/"
          xcrun simctl launch "$DEVICE" app.nicpa.amllplayer.test
          sleep 5
          xcrun simctl io "$DEVICE" screenshot build/library-light.png
          xcrun simctl ui "$DEVICE" appearance dark
          sleep 2
          xcrun simctl io "$DEVICE" screenshot build/library-dark.png
      - name: Verify import, metadata, album grouping, independent copies and playback
        timeout-minutes: 15
        working-directory: native-ios
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices booted -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for v in d["devices"].values() for x in v if x["state"] == "Booted"))')
          xcrun simctl ui "$DEVICE" appearance light
          xcodebuild test -project NICMusic.xcodeproj -scheme NICMusic -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO -derivedDataPath build/simulator -resultBundlePath build/ImportTests.xcresult CODE_SIGNING_ALLOWED=NO > build-tests.log 2>&1 || { tail -150 build-tests.log; exit 1; }
          xcrun simctl launch "$DEVICE" app.nicpa.amllplayer.test
          sleep 3
          xcrun simctl io "$DEVICE" screenshot build/library-imported.png
      - name: Export test screenshots
        if: always()
        working-directory: native-ios
        run: |
          if [ -d build/ImportTests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/ImportTests.xcresult --output-path build/test-attachments || true
          fi
          DEVICE=$(xcrun simctl list devices booted -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((x["udid"] for v in d["devices"].values() for x in v if x["state"] == "Booted"), ""))')
          if [ -n "$DEVICE" ]; then
            xcrun simctl spawn "$DEVICE" log show --last 10m --style compact --predicate 'process == "NICMusic" OR (process == "com.apple.DocumentManagerUICore.DocumentManagerService" AND messageType == error)' > build-import-runtime.log 2>&1 || true
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: NIC-Music-iOS
          path: |
            native-ios/build/package/*.ipa
            native-ios/build/package/SHA256.txt
            native-ios/build/library-*.png
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Native-test-results
          path: |
            native-ios/build/ImportTests.xcresult
            native-ios/build/test-attachments
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Native-build-logs
          path: native-ios/build-*.log
          retention-days: 7
